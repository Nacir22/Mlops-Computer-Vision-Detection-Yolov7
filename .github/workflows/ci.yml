name: CI

# Run on every push and pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # We install ONLY the light dependencies the tests actually need, so CI is
      # fast and does not download heavy packages like torch. The test suite is
      # designed to run without a GPU or a trained model.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml fastapi httpx python-multipart

      - name: Validate the sample dataset structure (non-blocking)
        run: |
          python scripts/validate_dataset.py --data-dir data || true

      - name: Run tests
        run: pytest tests/ -q
